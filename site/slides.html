<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="由茶名有解 Wiki 整理的教學簡報。">
<title>教學簡報｜茶名有解</title>
<link rel="stylesheet" href="./slides.css">
<script type="module" src="./slides.js"></script>
</head>
<body>
<header class="bar">
  <div class="bar-left">
    <button type="button" id="outline-toggle" class="outline-toggle" aria-expanded="false" aria-controls="outline">☰ 目錄</button>
    <a class="home" href="../">← 茶名有解</a>
  </div>
  <span class="counter" id="counter" aria-live="polite"></span>
</header>
<div class="layout">
  <nav id="outline" class="outline" aria-label="投影片目錄">
    <p class="outline-title">投影片目錄</p>
    <ol id="outline-list"></ol>
  </nav>
  <main id="stage" class="stage"><p class="loading">正在載入簡報…</p></main>
</div>
<div class="outline-backdrop" id="outline-backdrop" hidden></div>
<nav class="controls" aria-label="投影片切換">
  <button type="button" id="prev" aria-label="上一張">← 上一張</button>
  <div class="progress" aria-hidden="true"><span id="progress"></span></div>
  <button type="button" id="next" aria-label="下一張">下一張 →</button>
</nav>
<p class="hint">可用鍵盤左右方向鍵翻頁；每張下方的「依據」連到 Wiki 原文頁。</p>
</body>
</html>
